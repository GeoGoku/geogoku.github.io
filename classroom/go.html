<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate">
<title>加入课堂</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#172b43;background:#f1f5fa}
*{box-sizing:border-box}body{margin:0}
header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid #d8e1eb}
.brand{font-weight:800;font-size:18px;text-decoration:none;color:#172b43}
.brand span{color:#185dcb;margin-left:4px}
#svc{font-size:12px;color:#596b80}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
.card{background:#fff;border:1px solid #d8e1eb;border-radius:16px;padding:20px}
h1{font-size:24px;margin:4px 0 10px}
p{color:#596b80;line-height:1.55}
label{display:block;font-weight:650;margin:14px 0 6px;color:#172b43}
input,button{font:inherit;font-size:16px}
input{width:100%;border:1px solid #aebfd1;border-radius:10px;padding:12px}
button{border:0;border-radius:10px;min-height:48px;padding:12px 16px;font-weight:700;background:#185dcb;color:#fff;width:100%;margin-top:16px}
button.ghost{background:#eaf0f7;color:#234568}
.cls{display:block;width:100%;text-align:left;background:#fff;color:#172b43;border:2px solid #c2d0df;border-radius:12px;padding:14px;margin:8px 0}
.cls b{display:block;font-size:18px}
.cls small{color:#596b80}
.cls.on{border-color:#185dcb;background:#eaf1fb}
.err{color:#a03721;background:#fff0eb;border-radius:8px;padding:10px 12px}
.ok{color:#187546;background:#edf8f0;border-radius:8px;padding:10px 12px}
.choices{display:flex;gap:8px;margin:16px 0}
.choices label{flex:1;margin:0}
.choices span{display:flex;align-items:center;justify-content:center;height:64px;border:2px solid #c2d0df;border-radius:12px;font-size:24px;font-weight:800}
.choices input{position:absolute;opacity:0;width:1px;height:1px}
.choices input:checked+span{background:#185dcb;color:#fff;border-color:#185dcb}
.wait{background:#eaf1fb;border-radius:12px;padding:18px}
.qnum{font-size:28px;font-weight:800}
.timer{font-size:24px;color:#185dcb;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tip{background:#fff8e8;border:1px solid #f0d48a;color:#6a4b00;border-radius:10px;padding:10px 12px}
.cdnfoot{margin:18px 0 0;font-size:12px}
.cdnfoot a{color:#8a97a8;text-decoration:none}
</style>
</head>
<body>
<header><a class="brand" href="./index.html">课堂<span>答题</span></a><span id="svc">学生端</span></header>
<main id="app">
<section class="card">
<h1>加入课堂</h1>
<p>填写课堂编号、姓名和学号。当前课堂编号是 <b>6</b>（地物23-1）。</p>
<div id="list"><p>正在查找班级…</p></div>
<form id="f">
<label>课堂编号</label>
<input id="manual" name="sessionId" inputmode="numeric" value="6" placeholder="老师屏幕上的数字，例如 6">
<label>姓名</label>
<input id="name" name="name" required maxlength="40" placeholder="姓名">
<label>学号</label>
<input id="stu" name="studentId" required maxlength="40" placeholder="学号">
<button type="submit">进入课堂</button>
</form>
<p id="msg" class="tip">手机看不到班级时，直接填编号 6 即可。微信请点右上角「在浏览器打开」。</p>
<button type="button" class="ghost" id="retry">重新查找课堂</button>
<p class="cdnfoot"><a target="_blank" href="http://www.freecdn.pw/?zzwz">本站由免费云加速（FreeCDN）提供网站加速和攻击防御服务</a></p>
</section>
</main>
<script src="./config.js"></script>
<script src="./go-c.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>加入课堂</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#172b43;background:#f1f5fa}
*{box-sizing:border-box}body{margin:0}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid #d8e1eb}
.brand{font-weight:800;font-size:20px;text-decoration:none;color:#172b43}
.brand span{color:#185dcb;margin-left:4px}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
.card{background:#fff;border:1px solid #d8e1eb;border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:26px;margin:4px 0 12px}
p{color:#596b80;line-height:1.6}
label{display:block;font-weight:650;margin:14px 0 6px}
input,button{font:inherit;font-size:16px}
input{width:100%;border:1px solid #aebfd1;border-radius:10px;padding:12px}
button{border:0;border-radius:10px;min-height:48px;padding:12px 16px;font-weight:700;background:#185dcb;color:#fff;width:100%;margin-top:16px}
button.ghost{background:#eaf0f7;color:#234568}
.cls{display:block;width:100%;text-align:left;background:#fff;color:#172b43;border:2px solid #c2d0df;border-radius:12px;padding:14px;margin:8px 0;min-height:64px}
.cls b{display:block;font-size:18px}
.cls small{color:#596b80;font-weight:500}
.cls.on{border-color:#185dcb;background:#eaf1fb}
.err{color:#a03721;background:#fff0eb;border-radius:8px;padding:10px 12px}
.ok{color:#187546;background:#edf8f0;border-radius:8px;padding:10px 12px;font-weight:650}
.choices{display:flex;gap:8px;margin:16px 0}
.choices label{flex:1;margin:0}
.choices span{display:flex;align-items:center;justify-content:center;height:64px;border:2px solid #c2d0df;border-radius:12px;font-size:24px;font-weight:800}
.choices input{position:absolute;opacity:0;width:1px;height:1px}
.choices input:checked+span{background:#185dcb;color:#fff;border-color:#185dcb}
.wait{background:#eaf1fb;border-radius:12px;padding:18px}
.qnum{font-size:28px;font-weight:800}
.timer{font-size:24px;color:#185dcb;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header><a class="brand" href="./go.html">课堂<span>答题</span></a><span id="svc">连接中</span></header>
<main id="app"></main>
<script src="./go.js?v=1"></script>
</body>
</html>
